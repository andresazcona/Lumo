name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The security rules are the whole privacy model, so they run against the real emulators.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:rules

  image:
    runs-on: ubuntu-latest
    needs: [app, rules]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lumo:ci
      - name: Smoke test the container
        run: |
          docker run -d --name lumo -p 8080:8080 -e USE_EMULATORS=true lumo:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/ >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS localhost:8080/ | grep -q 'id="root"'
          curl -fsS localhost:8080/feed | grep -q 'id="root"'          # SPA fallback
          curl -fsS localhost:8080/config.js | grep -q 'useEmulators: true'
          test "$(docker exec lumo id -u)" != "0"                       # runs as non-root
          # A hostile value must stay inside its string: quotes are stripped, so it cannot close it.
          out=$(docker run --rm -e FIREBASE_API_KEY='k"; alert(1); //' --entrypoint sh lumo:ci \
            -c '/docker-entrypoint.d/40-lumo-config.sh && cat /tmp/lumo/config.js')
          echo "$out" | grep -q 'apiKey: "k; alert(1); //"'
          docker logs lumo
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lumo:latest
            ghcr.io/${{ github.repository_owner }}/lumo:${{ github.sha }}
